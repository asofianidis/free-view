<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FreeView</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    body { width: 340px; height: auto; background: #181b24; }
    :root[data-theme="light"] body { background: #fff; }
    main { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    header { display: flex; align-items: center; gap: 10px; }
    header img { width: 24px; height: 24px; }
    header h1 { font-size: 15px; margin: 0; flex: 1; font-weight: 600; }
    .preview { aspect-ratio: 16 / 10; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: var(--surface-2); }
    .preview img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
    .actions { display: flex; gap: 8px; }
    .actions .btn { flex: 1; }
    .status { font-size: 12px; margin: 0; }
    .ok { color: #3fbf62; }
    .link { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; font-size: 12px; padding: 0; }
  </style>
</head>
<body>
  <main id="main">
    <header>
      <img src="icons/icon32.png" alt="">
      <h1>Add to FreeView</h1>
      <button class="link" id="openNewtab">Open</button>
      <button class="link" id="openSettings">Settings</button>
    </header>
    <div class="preview" id="preview"></div>
    <label>Title <input id="title"></label>
    <label>URL <input id="url"></label>
    <label>Group <select id="group"></select></label>
    <p class="status" id="status" hidden></p>
    <div class="actions">
      <button class="btn danger" id="remove" hidden>Remove</button>
      <button class="btn primary" id="save">Add dial</button>
    </div>
  </main>
  <main id="locked" hidden>
    <p>FreeView is locked. Open a new tab to unlock it.</p>
  </main>
  <script type="module" src="js/popup.js"></script>
</body>
</html>
